<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Depo Operasyon Yönetim Sistemi{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">📦 Depo Operasyon</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/urunler/">Ürünler</a></li>
                <li class="nav-item"><a class="nav-link" href="/siparisler/">Siparişler</a></li>
                <li class="nav-item"><a class="nav-link" href="/iadeler/">İadeler</a></li>
                <li class="nav-item"><a class="nav-link" href="/raporlar/">Raporlar</a></li>
                <li class="nav-item"><a class="nav-link" href="/audit-log/">Audit Log</a></li>
                <li class="nav-item"><a class="nav-link" href="/personeller/">Personeller</a></li>
                <li class="nav-item"><a class="nav-link" href="/toplamalar/">Toplamalar</a></li>
            </ul>
        </div>
    </div>
</nav>

<div id="alertContainer" class="position-fixed top-0 end-0 p-3" style="z-index: 11"></div>

<main class="py-4">
    <div class="container-fluid">{% block content %}{% endblock %}</div>
</main>

<footer class="bg-light text-center py-3 mt-5">
    <p class="mb-0">© 2026 Depo Operasyon Yönetim Sistemi</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
