<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Depo Takip Sistemi{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                📊 Depo Takip Sistemi
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'main.index' %}active{% endif %}" href="/">Ana Sayfa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'kayitlar.lista' %}active{% endif %}" href="/kayitlar/">Kayıtlar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'personeller.lista' %}active{% endif %}" href="/personeller/">Personeller</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'toplamalar.lista' %}active{% endif %}" href="/toplamalar/">Toplamalar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'raporlar.index' %}active{% endif %}" href="/raporlar/">Raporlar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Alert Messages -->
    <div id="alertContainer" class="position-fixed top-0 end-0 p-3" style="z-index: 11">
        <!-- Alerts burada görünecek -->
    </div>

    <!-- Main Content -->
    <main class="py-4">
        <div class="container-fluid">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-light text-center py-3 mt-5">
        <p class="mb-0">© 2024 Depo Performans ve İş Takip Sistemi</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Main JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
