{% extends "base.html" %}

{% block title %}Raporlar - Depo Takip Sistemi{% endblock %}

{% block content %}
<h1 class="mb-4">📊 Raporlar</h1>

<div class="card mb-4">
    <div class="card-header bg-info text-white">
        <h5 class="mb-0">Excel Raporu Oluştur</h5>
    </div>
    <div class="card-body">
        <form id="raporForm">
            <div class="row">
                <div class="col-md-5">
                    <label class="form-label">Başlangıç Tarihi</label>
                    <input type="date" class="form-control" id="tarihBaslangic" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Bitiş Tarihi</label>
                    <input type="date" class="form-control" id="tarihBitis" required>
                </div>
                <div class="col-md-2">
                    <label>&nbsp;</label>
                    <button type="submit" class="btn btn-info w-100">📥 Oluştur</button>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('raporForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const tarihBaslangic = document.getElementById('tarihBaslangic').value;
        const tarihBitis = document.getElementById('tarihBitis').value;
        
        try {
            const response = await fetch('/raporlar/api/excel-olustur', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tarih_baslangic: tarihBaslangic, tarih_bitis: tarihBitis })
            });
            const result = await response.json();
            if (result.basarili) {
                showAlert('success', '✓ Excel hazırlandı!');
                window.location.href = `/raporlar/download/${result.dosya}`;
            } else {
                showAlert('danger', '✗ ' + result.mesaj);
            }
        } catch (e) {
            showAlert('danger', '✗ Hata');
        }
    });
</script>
{% endblock %}
